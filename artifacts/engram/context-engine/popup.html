<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ENGRAM</title>
    <style>
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --engram: #7c3aed;
        --engram-light: #a78bfa;
        --green: #22c55e;
        --yellow: #eab308;
        --red: #f87171;
      }
      html, body { margin: 0; padding: 0; }
      body {
        width: 340px;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
      }
      .wrap { padding: 16px; }
      .brand {
        display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
      }
      .logo {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; letter-spacing: 0.22em; color: var(--engram-light);
        font-weight: 600;
      }
      .tag {
        font-size: 10px; color: var(--muted); text-transform: uppercase;
        letter-spacing: 0.1em; padding: 2px 6px; border: 1px solid var(--border);
        border-radius: 4px;
      }
      .status {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 12px; background: var(--card); border: 1px solid var(--border);
        border-radius: 8px; margin-bottom: 12px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 8px; }
      .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
      .dot.warn { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
      .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
      .status-text { flex: 1; font-size: 12px; line-height: 1.35; }
      .status-text a { color: var(--engram-light); text-decoration: none; }
      .status-text a:hover { text-decoration: underline; }
      .muted { color: var(--muted); }
      .btn {
        display: block; width: 100%; padding: 10px 12px; margin-top: 8px;
        background: var(--card); color: var(--text); border: 1px solid var(--border);
        border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
        text-align: center; transition: all 120ms ease; font-family: inherit;
      }
      .btn:hover { border-color: var(--engram); background: #1c222b; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn.primary { background: var(--engram); color: #fff; border-color: var(--engram); }
      .btn.primary:hover { background: #8b5cf6; }
      .btn-row { display: flex; gap: 8px; }
      .btn-row .btn { flex: 1; margin-top: 8px; }
      .toast {
        margin-top: 10px; padding: 8px 10px; border-radius: 6px;
        font-size: 12px; display: none;
      }
      .toast.show { display: block; }
      .toast.ok { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
      .toast.err { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5; }

      /* ── Detected project card ── */
      #detected-project {
        display: none;
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--card);
      }
      #detected-project.show { display: block; }
      #detected-project.confident { border-color: rgba(124,58,237,0.5); }
      #detected-project.ambiguous { border-color: rgba(234,179,8,0.4); }

      .dp-header {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 12px 6px;
      }
      .dp-check {
        width: 16px; height: 16px; border-radius: 50%;
        background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4);
        display: flex; align-items: center; justify-content: center;
        flex: 0 0 16px; font-size: 9px; color: var(--green);
      }
      .dp-label {
        font-size: 11px; color: var(--muted); text-transform: uppercase;
        letter-spacing: 0.08em; flex: 1;
      }
      .dp-confidence {
        font-size: 10px; color: var(--muted);
      }
      .dp-confidence.high { color: #86efac; }
      .dp-confidence.low { color: var(--yellow); }

      .dp-repo {
        padding: 4px 12px 10px;
        font-size: 12px; font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, monospace;
        color: var(--engram-light);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .dp-repo span.project-name {
        color: var(--muted); font-weight: 400; font-family: inherit;
        font-size: 11px; display: block; margin-top: 1px;
      }

      /* Confidence bar */
      .dp-bar-wrap {
        height: 2px; background: var(--border); margin: 0 12px 10px;
        border-radius: 1px; overflow: hidden;
      }
      .dp-bar {
        height: 100%; border-radius: 1px;
        background: var(--engram);
        transition: width 400ms ease;
      }
      .dp-bar.low { background: var(--yellow); }

      /* Wrong repo row */
      .dp-footer {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 12px;
        border-top: 1px solid var(--border);
        background: rgba(0,0,0,0.2);
      }
      .dp-wrong-label {
        font-size: 11px; color: var(--muted);
      }
      .dp-change-btn {
        font-size: 11px; color: var(--engram-light);
        background: none; border: 1px solid rgba(124,58,237,0.35);
        border-radius: 5px; padding: 3px 9px; cursor: pointer;
        font-family: inherit; transition: all 100ms ease;
      }
      .dp-change-btn:hover { background: rgba(124,58,237,0.12); border-color: var(--engram); }

      /* Project picker dropdown (shown when "Change" is clicked) */
      #project-picker-wrap {
        display: none;
        padding: 8px 12px 10px;
        border-top: 1px solid var(--border);
      }
      #project-picker-wrap.show { display: block; }
      #project-picker-wrap label {
        font-size: 11px; color: var(--muted); text-transform: uppercase;
        letter-spacing: 0.08em; display: block; margin-bottom: 6px;
      }
      #project-picker {
        width: 100%; box-sizing: border-box;
        padding: 7px 10px;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px;
        font-family: inherit; font-size: 12px; cursor: pointer;
      }
      #project-picker:focus { outline: none; border-color: var(--engram); }
      #reassign-confirm {
        display: block; width: 100%; margin-top: 7px;
        padding: 7px; background: var(--engram); color: #fff;
        border: none; border-radius: 6px; cursor: pointer;
        font-family: inherit; font-size: 12px; font-weight: 500;
        transition: background 120ms ease;
      }
      #reassign-confirm:hover { background: #8b5cf6; }
      #reassign-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

      details {
        margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
      }
      summary {
        cursor: pointer; font-size: 11px; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.1em;
        outline: none; user-select: none;
      }
      summary:hover { color: var(--text); }
      .field { margin-top: 10px; }
      .field label {
        display: block; font-size: 11px; color: var(--muted);
        margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em;
      }
      .field input {
        width: 100%; box-sizing: border-box;
        padding: 8px 10px; background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px;
      }
      .field input:focus { outline: none; border-color: var(--engram); }
      .footer {
        margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
        font-size: 11px; color: var(--muted); text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <span class="logo">ENGRAM</span>
        <span class="tag">v0.3</span>
      </div>

      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text" class="status-text muted">Checking…</span>
      </div>

      <button id="capture-btn" class="btn primary" disabled>Capture this conversation</button>
      <button id="checkpoint-btn" class="btn" disabled style="margin-top:6px; border-color: rgba(124,58,237,0.4); color: var(--engram-light); font-size: 12px; padding: 8px 12px;">
        ⚡ Save Checkpoint &amp; Get Continuation Brief
      </button>

      <!-- ── Continuation brief panel (shown after checkpoint) ── -->
      <div id="checkpoint-panel" style="display:none; margin-top:10px;">
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
          <span style="font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted);">Continuation Brief</span>
          <span id="checkpoint-token-est" style="font-size:10px; color:var(--muted);"></span>
          <button id="checkpoint-dismiss" style="margin-left:auto; background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:0;">✕</button>
        </div>
        <textarea id="checkpoint-brief" readonly
          style="width:100%; box-sizing:border-box; height:120px; background:var(--bg);
                 border:1px solid var(--border); border-radius:6px; padding:8px;
                 color:var(--text); font-family:ui-monospace,SFMono-Regular,monospace;
                 font-size:10px; line-height:1.5; resize:vertical; outline:none;">
        </textarea>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <button id="checkpoint-copy" class="btn primary" style="margin-top:0; font-size:12px; padding:7px;">
            Copy &amp; paste into new tab
          </button>
          <button id="checkpoint-open" class="btn" style="margin-top:0; font-size:12px; padding:7px; flex:0 0 auto;">
            Open project →
          </button>
        </div>
        <p id="checkpoint-project-label" style="margin:5px 0 0; font-size:10px; color:var(--muted); text-align:center;"></p>
      </div>

      <!-- ── Detected project card (shown after a successful capture) ── -->
      <div id="detected-project">
        <div class="dp-header">
          <div class="dp-check">✓</div>
          <span class="dp-label">Routed to project</span>
          <span id="dp-confidence" class="dp-confidence"></span>
        </div>
        <div class="dp-repo" id="dp-repo">
          <span id="dp-project-name" class="project-name"></span>
        </div>
        <div class="dp-bar-wrap">
          <div id="dp-bar" class="dp-bar" style="width:0%"></div>
        </div>

        <!-- Wrong repo picker -->
        <div id="project-picker-wrap">
          <label for="project-picker">Move to a different project</label>
          <select id="project-picker">
            <option value="">Loading projects…</option>
          </select>
          <button id="reassign-confirm" disabled>Move capture</button>
        </div>

        <div class="dp-footer">
          <span class="dp-wrong-label" id="dp-wrong-label">Wrong project?</span>
          <button class="dp-change-btn" id="dp-change-btn">Change ▾</button>
        </div>
      </div>

      <div class="btn-row">
        <button id="dashboard-btn" class="btn">Dashboard</button>
        <button id="ask-btn" class="btn">Ask</button>
      </div>

      <div id="toast" class="toast"></div>

      <details open>
        <summary>Settings</summary>

        <div class="field">
          <label>Capture mode</label>
          <div id="mode-toggle" style="display:flex; gap:6px; margin-top:4px;">
            <button type="button" class="mode-btn active" data-mode="personal" style="flex:1; padding:8px; background:var(--card); color:var(--text); border:1px solid var(--engram); border-radius:6px; cursor:pointer; font-family:inherit; font-size:12px;">
              Personal
            </button>
            <button type="button" class="mode-btn" data-mode="team" style="flex:1; padding:8px; background:var(--card); color:var(--muted); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-family:inherit; font-size:12px;">
              Team
            </button>
          </div>
          <p id="mode-hint" style="margin:6px 0 0; font-size:11px; line-height:1.4; color:var(--muted);">
            Private to you. Raw chat never shared.
          </p>
        </div>

        <div id="team-picker-field" class="field" style="margin-top:12px; display:none;">
          <label for="team-picker">Send to team</label>
          <select id="team-picker"
            style="width:100%; box-sizing:border-box; padding:8px 10px;
                   background:var(--bg); color:var(--text);
                   border:1px solid var(--border); border-radius:6px;
                   font-family:inherit; font-size:12px; cursor:pointer;">
          </select>
          <p id="team-picker-hint" style="margin:6px 0 0; font-size:11px; line-height:1.4; color:var(--muted);">
            This conversation will be shared with this team only.
          </p>
        </div>

        <div class="field" style="margin-top:14px;">
          <label for="api-url">ENGRAM API URL</label>
          <input id="api-url" type="url" placeholder="https://your-engram.replit.app" />
          <button id="save-api" class="btn" style="margin-top: 8px;">Save & re-check</button>
        </div>
      </details>

      <div class="footer">Git for AI Decisions</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
